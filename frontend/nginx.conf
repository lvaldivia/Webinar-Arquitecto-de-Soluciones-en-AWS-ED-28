# nginx del contenedor del frontend (solo para desarrollo local con docker compose).
#
# Simula lo que hace CloudFront en AWS:
#   /        -> archivos estáticos (en AWS: bucket S3)
#   /api/*   -> backend           (en AWS: ALB -> instancias del ASG)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Lo consultamos cada 5 s para descubrir réplicas
    # nuevas cuando se hace `docker compose up --scale api=3`.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        # Usar una variable obliga a nginx a resolver "api" con el resolver de
        # arriba. El DNS de Docker devuelve la IP de cada réplica y nginx las
        # va rotando: es nuestro "balanceador" local.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # La API nunca se cachea (igual que el behavior /api/* de CloudFront).
        add_header Cache-Control "no-store" always;
    }

    # Los archivos de Vite llevan un hash en el nombre: se pueden cachear mucho tiempo.
    # (La regex va entre comillas porque contiene llaves.)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html
    # (en CloudFront se hace con las páginas de error 403/404 -> /index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
